<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="216" viewBox="0 0 880 216" fill="none" role="img" aria-label="Engineer in training, based in Tunisia. I like software that runs close to the machine, and I care about tools that are fast, private and free to use. Most of what I build is open source."><style>.body{font:400 15.5px Inter,'SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:-.1px}.b14{font:500 14px Inter,'SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.eye{font:600 11px 'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:2px}.lab{font:600 10.5px 'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:1.6px}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="216" gradientUnits="userSpaceOnUse"><stop stop-color="#FAFBFC"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient><linearGradient id="hl" x1="80" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#6248F5" stop-opacity="0"/><stop offset=".5" stop-color="#6248F5" stop-opacity=".7"/><stop offset="1" stop-color="#0A8BD6" stop-opacity="0"/></linearGradient></defs><rect x=".5" y=".5" width="879" height="215" rx="14" fill="url(#bg)" stroke="#1F2328" stroke-opacity="0.11"/><rect x="80" y="0" width="720" height="1" fill="url(#hl)"/><text x="28" y="38" class="eye" fill="#6248F5">01</text><text x="55.2" y="38" class="eye" fill="#8C959F">ABOUT</text><rect x="508" y="58" width="1" height="130" fill="#1F2328" fill-opacity="0.090"/><text x="28" y="78" class="body" fill="#1F2328">Engineer in training, based in Tunisia.</text><text x="28" y="104" class="body" fill="#59636E">I like software that runs close to the machine, and I</text><text x="28" y="130" class="body" fill="#59636E">care about tools that are fast, private and free to use.</text><text x="28" y="156" class="body" fill="#59636E">Most of what I build is open source.</text><text x="540" y="76" class="lab" fill="#8C959F">STUDYING</text><text x="636" y="76" class="b14" fill="#1F2328">Software engineering, MedTech</text><rect x="540" y="88" width="312" height="1" fill="#1F2328" fill-opacity="0.080"/><text x="540" y="112" class="lab" fill="#8C959F">FOCUS</text><text x="636" y="112" class="b14" fill="#1F2328">Systems, security and AI</text><rect x="540" y="124" width="312" height="1" fill="#1F2328" fill-opacity="0.080"/><text x="540" y="148" class="lab" fill="#8C959F">GOAL</text><text x="636" y="148" class="b14" fill="#1F2328">Ph.D. in software engineering</text><rect x="540" y="160" width="312" height="1" fill="#1F2328" fill-opacity="0.080"/><text x="540" y="184" class="lab" fill="#8C959F">SPEAKS</text><text x="636" y="184" class="b14" fill="#1F2328">Arabic, English, French</text></svg>
