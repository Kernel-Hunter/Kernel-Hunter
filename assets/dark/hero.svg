<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290" fill="none" role="img" aria-label="Karim Masmoudi. Software engineer. I build native Mac apps, developer tools and sandboxes for AI agents."><style>.o{transform-origin:728px 145px;animation:spin linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.p{transform-origin:64px 54px;animation:pulse 2.4s ease-out infinite}@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.9);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
