name: Refresh profile

on:
  schedule:
    - cron: "23 3 * * *" # daily, 03:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild SVGs from live GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets scripts/data.json
          git diff --staged --quiet || { git commit -m "chore: refresh profile stats [skip ci]" && git push; }
